
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shodh
      POSTGRES_PASSWORD: shodh_dev_password
      POSTGRES_DB: shodh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodh -d shodh"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  worker1:
    build: .
    env_file:
      - .env
    command: python -m app.workers.worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker2:
    build: .
    env_file:
      - .env
    command: python -m app.workers.worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
